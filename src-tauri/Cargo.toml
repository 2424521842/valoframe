[package]
name = "valorant-highlight-manager"
version = "0.2.2"
description = "VALOFRAME local VALORANT CN highlight asset manager"
authors = ["VALOFRAME Contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "valorant_highlight_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled", "collation"] }
base64 = "0.22"
flate2 = "1.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
sha2 = "0.10"
hex = "0.4"
minisign-verify = "0.2"
semver = "1"
tokio = { version = "1", features = ["macros", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
zip = { version = "=4.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
tempfile = "3"
windows-sys = { version = "0.61.2", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
