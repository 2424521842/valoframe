name: 内部 Alpha 测试记录
description: 汇总一次受控测试的环境、覆盖范围和结果
title: "[Alpha] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        当前只接受合成数据浏览器预览，或负责人/同一法律主体控制设备上的内部测试。不要上传原始视频、数据库、完整日志、真实路径、玩家名、OpenID、对局 ID、备注或未脱敏截图。
  - type: dropdown
    id: channel
    attributes:
      label: 测试通道
      options:
        - 浏览器界面预览（合成 mock 数据）
        - 桌面源码运行（受控设备）
        - 未签名内部 RC（受控设备）
    validations:
      required: true
  - type: input
    id: batch
    attributes:
      label: 测试批次 ID
      placeholder: alpha-internal-001
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Git commit
      description: 请填写完整 40 位 SHA；安装包还需在下方补充 SHA-256。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 与 WebView2 环境
      placeholder: Windows 11 24H2 build ... / x64 / WebView2 ...
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: 构建或安装器身份
      description: 源码运行填命令；内部 RC 填文件名、大小、SHA-256 和签名状态。
    validations:
      required: true
  - type: checkboxes
    id: coverage
    attributes:
      label: 已覆盖场景
      options:
        - label: 首次启动 / 空库
        - label: 默认、手动或多来源扫描
        - label: 取消、部分完成、失败与重启恢复
        - label: 搜索、筛选、账号与对局归组
        - label: 预览、缩略图与事件时间线
        - label: 收藏、标签、备注与批量操作
        - label: 回收与恢复
        - label: 永久删除（仅复制出的可丢弃素材）
        - label: 大库、最小窗口或缩放
        - label: 安装、重装、升级、禁止降级或卸载
  - type: textarea
    id: summary
    attributes:
      label: 结果摘要
      description: 写明通过、失败、未测和主要观察；单个缺陷请另建 Bug。
    validations:
      required: true
  - type: textarea
    id: issues
    attributes:
      label: 关联问题
      description: 列出相关 Issue 编号；P0 或安全问题不要公开粘贴细节。
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已确认该测试符合当前受控内部测试边界，没有向主体外分发安装器或 FFmpeg。
          required: true
        - label: 我已逐项预览并脱敏文本与附件，未上传用户素材、数据库或敏感身份信息。
          required: true
        - label: 永久删除若被测试，只使用了专门复制出的可丢弃素材。
          required: true
